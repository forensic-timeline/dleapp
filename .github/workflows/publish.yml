name: Upload Python Package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          VERINFO=$(grep -m1 '^dleapp_version' scripts/version_info.py | cut -d"'" -f2)
          echo "tag=$TAG pyproject=$PYPROJECT version_info=$VERINFO"
          if [ "$TAG" != "$PYPROJECT" ] || [ "$TAG" != "$VERINFO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan versi di pyproject.toml ($PYPROJECT) atau version_info.py ($VERINFO)"
            exit 1
          fi

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/dleapp/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1