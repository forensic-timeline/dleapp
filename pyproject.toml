[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dleapp"
version = "1.1.0"
description = "Digital forensics parser for DJI drone artifacts"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
include-package-data = true
py-modules = ["dleapp", "dleappGUI"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "assets*"]
exclude = [
    "tests*",
    "backup_artifacts_android*",
    "dleappvenv*",
    "*__pycache__*",
    "admin"
]
namespaces = true

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.pyd",
    "__pycache__/*",
    "**/__pycache__/*"
]

[tool.setuptools.package-data]
assets = ["*", "**/*"]
scripts = ["*", "**/*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
dleapp = "dleapp:main"
